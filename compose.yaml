services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: taskharbor
      POSTGRES_USER: taskharbor
      POSTGRES_PASSWORD: taskharbor
    ports:
      - "5433:5432"
    volumes:
      - taskharbor_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U taskharbor -d taskharbor",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taskharbor_postgres_data: